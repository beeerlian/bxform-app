table:
  name: question_answers
  schema: public
object_relationships:
  - name: answer_sheet
    using:
      foreign_key_constraint_on: answer_sheet_id
  - name: form
    using:
      foreign_key_constraint_on: form_id
  - name: question
    using:
      foreign_key_constraint_on: question_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
